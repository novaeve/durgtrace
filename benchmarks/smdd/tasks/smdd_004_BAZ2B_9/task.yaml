id: smdd_004_BAZ2B_9
name: Lead Optimization for BAZ2B (4IR5)
description: 'You are given a co-folded protein-ligand complex (complex.pdb) and a
  reference ligand (reference.sdf). Modify the reference ligand to optimize the following
  properties:

  - ppb: decrease by at least 5.0 from baseline 93.7281

  - solubility: increase by at least 0.5 from baseline -4.2083

  - cyp3a4: decrease by at least 0.1 from baseline 0.8306

  - herg: decrease by at least 0.1 from baseline 0.3559

  While holding these properties approximately constant:

  - bbb: keep within 0.1 of baseline (0.9058) (change tolerance)

  - clearance: keep within 5.0 of baseline (39.5604) (increase tolerance)

  - caco2: keep within 0.3 of baseline (-4.5350) (decrease tolerance)

  - ames: keep within 0.1 of baseline (0.1994) (increase tolerance)

  The output molecule must satisfy ALL of the following hard constraints:

  - SMILES validity: must be parseable and sanitizable by RDKit (no radicals, no disconnected
  fragments, no unreasonable valences)

  - Molecular weight: < 600 Da

  - LogP: between -1 and 5

  - TPSA: < 140 A^2

  - H-bond donors: <= 5

  - H-bond acceptors: <= 10

  - Rotatable bonds: <= 10

  - Net formal charge: between -2 and +2

  - Synthetic accessibility: SA score < 4.5

  - PAINS filter: must pass (no pan-assay interference substructures)

  - Structural alerts: must pass Brenk/NIH reactive group filters

  - Tanimoto similarity to reference: >= 0.7 (Morgan fingerprint, radius=2, 2048 bits)

  - Boltz binding probability: affinity_probability_binary > 0.7

  The pocket is defined by residues (chain, 1-indexed SEQRES position): A:32, A:33,
  A:34, A:36, A:37, A:38, A:39, A:40, A:42, A:43, A:44, A:46, A:81, A:84, A:85, A:88,
  A:89, A:95

  Output a single SMILES string to solution.smi.'
target_ligand:
  resname: LIG
  chain: L
  residue_number: 1
  insertion_code: ' '
pocket_residues: &id004
- - A
  - 32
- - A
  - 33
- - A
  - 34
- - A
  - 36
- - A
  - 37
- - A
  - 38
- - A
  - 39
- - A
  - 40
- - A
  - 42
- - A
  - 43
- - A
  - 44
- - A
  - 46
- - A
  - 81
- - A
  - 84
- - A
  - 85
- - A
  - 88
- - A
  - 89
- - A
  - 95
baseline_values:
  herg: 0.3559
  bbb: 0.9058
  solubility: -4.2083
  cyp3a4: 0.8306
  clearance: 39.5604
  caco2: -4.535
  ppb: 93.7281
  ames: 0.1994
  binding_affinity: -0.7841
optimization_objectives: &id003
- property: ppb
  direction: minimize
  threshold: 5.0
- property: solubility
  direction: maximize
  threshold: 0.5
- property: cyp3a4
  direction: minimize
  threshold: 0.1
- property: herg
  direction: minimize
  threshold: 0.1
hold_constant: &id001
- property: bbb
  tolerance: 0.1
  direction: change
- property: clearance
  tolerance: 5.0
  direction: increase
- property: caco2
  tolerance: 0.3
  direction: decrease
- property: ames
  tolerance: 0.1
  direction: increase
bbb_direction: maximize
hard_constraints:
- property: smiles_validity
  description: Parseable and sanitizable by RDKit (no radicals, no disconnected fragments,
    no unreasonable valences)
- property: molecular_weight
  threshold: <600 Da
  method: RDKit Descriptors.MolWt()
- property: logp
  threshold: -1 to 5
  method: RDKit Crippen.MolLogP()
- property: tpsa
  threshold: <140 A^2
  method: RDKit Descriptors.TPSA()
- property: hbd
  threshold: <=5
  method: RDKit Lipinski.NumHDonors()
- property: hba
  threshold: <=10
  method: RDKit Lipinski.NumHAcceptors()
- property: rotatable_bonds
  threshold: <=10
  method: RDKit Lipinski.NumRotatableBonds()
- property: formal_charge
  threshold: -2 to +2
  method: RDKit Chem.GetFormalCharge()
- property: synthetic_accessibility
  threshold: <4.5
  method: RDKit sascorer
- property: pains_filter
  description: Must pass (no pan-assay interference substructures)
  method: RDKit FilterCatalog with PAINS filters
- property: structural_alerts
  description: Must pass Brenk/NIH reactive group filters
  method: RDKit FilterCatalog with Brenk filters
- property: tanimoto_similarity
  threshold: '>=0.7'
  description: Morgan fingerprint, radius=2, 2048 bits
  method: RDKit AllChem.GetMorganFingerprintAsBitVect() + DataStructs.TanimotoSimilarity()
- property: boltz_binding_probability
  threshold: '>0.7'
  description: affinity_probability_binary from Boltz co-fold
input_files:
- complex.pdb
- reference.sdf
output_config:
  file_path: solution.smi
  format: smiles
evaluation:
- name: Validity
  module: metrics.chemistry
  function: assess_smiles_file_validity
  inputs:
  - source: output
    arg: file_path
  condition:
    eq: true
- name: Hard Constraints
  module: metrics.lead_optimization
  function: assess_hard_constraints
  result_key: all_passed
  inputs:
  - source: output
    arg: agent_file_path
  - source: file
    value: reference.sdf
    arg: reference_file_path
  condition:
    eq: true
- name: Hold-Constant Properties
  module: metrics.lead_optimization
  function: assess_hold_constant
  result_key: all_passed
  inputs:
  - source: output
    arg: agent_file_path
  - source: const
    value: &id002
      herg: 0.3559
      bbb: 0.9058
      solubility: -4.2083
      cyp3a4: 0.8306
      clearance: 39.5604
      caco2: -4.535
      ppb: 93.7281
      ames: 0.1994
      binding_affinity: -0.7841
    arg: baseline_values
  - source: const
    value: *id001
    arg: hold_constant
  condition:
    eq: true
- name: Optimization Objectives
  module: metrics.lead_optimization
  function: assess_optimization_objectives
  result_key: all_passed
  inputs:
  - source: output
    arg: agent_file_path
  - source: const
    value: *id002
    arg: baseline_values
  - source: const
    value: *id003
    arg: objectives
  condition:
    eq: true
- name: Boltz Binding & Affinity
  module: metrics.lead_optimization
  function: assess_boltz_task4
  result_key: all_passed
  inputs:
  - source: output
    arg: agent_file_path
  - source: file
    value: protein.fasta
    arg: protein_fasta_path
  - source: const
    value: *id004
    arg: pocket_contacts
  - source: const
    value: null
    arg: co_ligands
  - source: const
    value: -0.7840787172317505
    arg: baseline_affinity
  - source: const
    value: null
    arg: affinity_objective
  - source: const
    value: null
    arg: affinity_hold_constant
  - source: const
    value: 10
    arg: diffusion_samples
  condition:
    eq: true
