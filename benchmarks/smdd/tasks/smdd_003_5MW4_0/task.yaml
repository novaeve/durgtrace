input_files:
- complex.pdb
- reference.sdf
output_config:
    file_path: solution.smi
    format: smiles
evaluation:
-   name: Validity
    module: metrics.chemistry
    function: assess_smiles_file_validity
    inputs:
    -   source: output
        arg: file_path
    condition:
        eq: true
-   name: Tanimoto Similarity
    module: metrics.scaffold
    function: assess_tanimoto_similarity
    inputs:
    -   source: output
        arg: agent_file_path
    -   source: file
        value: reference.sdf
        arg: reference_file_path
    condition:
        lt: 0.5
-   name: Scaffold MCS
    module: metrics.scaffold
    function: assess_scaffold_mcs
    inputs:
    -   source: output
        arg: agent_file_path
    -   source: file
        value: reference.sdf
        arg: reference_file_path
    condition:
        lt: 0.65
-   name: Boltz Interaction Similarity
    module: metrics.interaction
    function: assess_boltz_all
    result_key: interaction_similarity
    inputs: &id002
    -   source: output
        arg: agent_file_path
    -   source: file
        value: protein.fasta
        arg: protein_fasta_path
    -   source: file
        value: ground_truth_docked.sdf
        arg: ground_truth_ligand_path
    -   source: file
        value: complex.pdb
        arg: ground_truth_protein_path
    -   source: const
        value: *id001
        arg: pocket_contacts
    -   source: const
        value: 10
        arg: diffusion_samples
    condition:
        gt: 0.75
-   name: Boltz Binding Probability
    module: metrics.interaction
    function: assess_boltz_all
    result_key: binding_probability
    inputs: *id002
    condition:
        gt: 0.7
