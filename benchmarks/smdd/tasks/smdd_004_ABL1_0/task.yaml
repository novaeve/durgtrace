id: smdd_004_ABL1_0
name: Lead Optimization for ABL1 (4YC8)
description: 'You are given a co-folded protein-ligand complex (complex.pdb) and a
  reference ligand (reference.sdf). Modify the reference ligand to optimize the following
  properties:

  - binding_affinity: decrease by at least 0.3 from baseline -1.5966

  - caco2: increase by at least 0.3 from baseline -5.5316

  - herg: decrease by at least 0.1 from baseline 0.4690

  - ames: decrease by at least 0.1 from baseline 0.5278

  - bbb: increase by at least 0.1 from baseline 0.5545

  While holding these properties approximately constant:


  The output molecule must satisfy ALL of the following hard constraints:

  - SMILES validity: must be parseable and sanitizable by RDKit (no radicals, no disconnected
  fragments, no unreasonable valences)

  - Molecular weight: < 600 Da

  - LogP: between -1 and 5

  - TPSA: < 140 A^2

  - H-bond donors: <= 5

  - H-bond acceptors: <= 10

  - Rotatable bonds: <= 10

  - Net formal charge: between -2 and +2

  - Synthetic accessibility: SA score < 4.5

  - PAINS filter: must pass (no pan-assay interference substructures)

  - Structural alerts: must pass Brenk/NIH reactive group filters

  - Tanimoto similarity to reference: >= 0.7 (Morgan fingerprint, radius=2, 2048 bits)

  - Boltz binding probability: affinity_probability_binary > 0.7

  The pocket is defined by residues (chain, 1-indexed SEQRES position): A:22, A:23,
  A:31, A:44, A:45, A:46, A:57, A:58, A:59, A:60, A:61, A:62, A:63, A:65, A:74, A:76,
  A:87, A:88, A:89, A:90, A:91, A:92, A:93, A:94, A:95, A:96, A:97, A:100, A:145,
  A:146, A:156, A:157, A:158

  Output a single SMILES string to solution.smi.'
target_ligand:
  resname: LIG
  chain: L
  residue_number: 1
  insertion_code: ' '
