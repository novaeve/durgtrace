- - A
  - 165
- - A
  - 184
- - A
  - 185
- - A
  - 210
baseline_values:
  herg: 0.2557
  bbb: 0.7012
  solubility: -6.5173
  cyp3a4: 0.7081
  clearance: 47.5219
  caco2: -4.6666
  ppb: 103.8297
  ames: 0.6395
  binding_affinity: -1.3726
optimization_objectives: &id003
- property: ppb
  direction: minimize
  threshold: 5.0
- property: clearance
  direction: minimize
  threshold: 5.0
- property: binding_affinity
  direction: minimize
  threshold: 0.3
hold_constant: &id001
- property: herg
  tolerance: 0.1
  direction: increase
- property: bbb
  tolerance: 0.1
  direction: change
- property: solubility
  tolerance: 0.5
  direction: decrease
- property: cyp3a4
  tolerance: 0.1
  direction: increase
bbb_direction: maximize
hard_constraints:
- property: smiles_validity
  description: Parseable and sanitizable by RDKit (no radicals, no disconnected fragments,
    no unreasonable valences)
- property: molecular_weight
  threshold: <600 Da
  method: RDKit Descriptors.MolWt()
- property: logp
  threshold: -1 to 5
  method: RDKit Crippen.MolLogP()
- property: tpsa
  threshold: <140 A^2
  method: RDKit Descriptors.TPSA()
- property: hbd
  threshold: <=5
  method: RDKit Lipinski.NumHDonors()
- property: hba
  threshold: <=10
  method: RDKit Lipinski.NumHAcceptors()
- property: rotatable_bonds
  threshold: <=10
  method: RDKit Lipinski.NumRotatableBonds()
- property: formal_charge
  threshold: -2 to +2
  method: RDKit Chem.GetFormalCharge()
- property: synthetic_accessibility
  threshold: <4.5
  method: RDKit sascorer
- property: pains_filter
  description: Must pass (no pan-assay interference substructures)
  method: RDKit FilterCatalog with PAINS filters
- property: structural_alerts
  description: Must pass Brenk/NIH reactive group filters
  method: RDKit FilterCatalog with Brenk filters
- property: tanimoto_similarity
  threshold: '>=0.7'
  description: Morgan fingerprint, radius=2, 2048 bits
  method: RDKit AllChem.GetMorganFingerprintAsBitVect() + DataStructs.TanimotoSimilarity()
- property: boltz_binding_probability
  threshold: '>0.7'
  description: affinity_probability_binary from Boltz co-fold
input_files:
- complex.pdb
- reference.sdf
output_config:
  file_path: solution.smi
  format: smiles
evaluation:
- name: Validity
  module: metrics.chemistry
  function: assess_smiles_file_validity
  inputs:
  - source: output
    arg: file_path
  condition:
    eq: true
- name: Hard Constraints
  module: metrics.lead_optimization
  function: assess_hard_constraints
  result_key: all_passed
  inputs:
  - source: output
    arg: agent_file_path
  - source: file
    value: reference.sdf
    arg: reference_file_path
  condition:
    eq: true
- name: Hold-Constant Properties
  module: metrics.lead_optimization
  function: assess_hold_constant
  result_key: all_passed
  inputs:
  - source: output
    arg: agent_file_path
  - source: const
    value: &id002
      herg: 0.2557
      bbb: 0.7012
      solubility: -6.5173
      cyp3a4: 0.7081
      clearance: 47.5219
      caco2: -4.6666
      ppb: 103.8297
      ames: 0.6395
      binding_affinity: -1.3726
    arg: baseline_values
  - source: const
    value: *id001
    arg: hold_constant
  condition:
    eq: true
- name: Optimization Objectives
  module: metrics.lead_optimization
  function: assess_optimization_objectives
  result_key: all_passed
  inputs:
  - source: output
    arg: agent_file_path
  - source: const
    value: *id002
    arg: baseline_values
  - source: const
    value: *id003
    arg: objectives
  condition:
    eq: true
- name: Boltz Binding & Affinity
  module: metrics.lead_optimization
  function: assess_boltz_task4
  result_key: all_passed
  inputs:
  - source: output
    arg: agent_file_path
  - source: file
    value: protein.fasta
    arg: protein_fasta_path
  - source: const
    value: *id004
    arg: pocket_contacts
  - source: const
    value: null
    arg: co_ligands
  - source: const
    value: -1.3725892305374146
    arg: baseline_affinity
  - source: const
    value:
      direction: minimize
      threshold: 0.3
    arg: affinity_objective
  - source: const
    value: null
    arg: affinity_hold_constant
  - source: const
    value: 10
    arg: diffusion_samples
  condition:
    eq: true
