id: smdd_002_P03372_0
name: Pharmacophore_Estrogen_Receptor
description: 'You are given a protein receptor structure (receptor.pdb). The binding
    pocket center is located at coordinates (106.730247, 15.023100, 96.615646) in
    Angstroms with a pocket radius of 12 Angstroms. Your task is to identify the 3
    most conserved pharmacophoric interaction points within this binding pocket. Each
    point should be specified by its 3D coordinates (x, y, z) and one interaction
    type. The valid interaction types are: Donor, Acceptor, Aromatic, Hydrophobic,
    Cation, Anion. Output a CSV file titled ''solution.csv'' with columns x,y,z,type
    containing exactly 3 rows (no header).'
pocket_center:
- 106.7302474975586
- 15.023099899291992
- 96.61564636230469
input_files:
- receptor.pdb
output_config:
    file_path: solution.csv
    format: csv
evaluation:
-   name: 3D Pharmacophore Match
    module: metrics.pharmacophore_3d
    function: evaluate_3d_pharmacophore
    result_key: score
    inputs:
    -   source: output
        arg: agent_solution_path
    -   source: file
        value: ground_truth.json
        arg: ground_truth_path
    condition:
        eq: 1.0
