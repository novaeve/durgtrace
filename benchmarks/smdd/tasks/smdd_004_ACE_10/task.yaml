id: smdd_004_ACE_10
name: Lead Optimization for ACE (7Z70)
description: 'You are given a co-folded protein-ligand complex (complex.pdb) and a
  reference ligand (reference.sdf). Modify the reference ligand to optimize the following
  properties:

  - binding_affinity: decrease by at least 0.3 from baseline -0.8826

  - bbb: decrease by at least 0.1 from baseline 0.7106

  While holding these properties approximately constant:

  - herg: keep within 0.1 of baseline (0.0239) (increase tolerance)

  - solubility: keep within 0.5 of baseline (-1.3253) (decrease tolerance)

  - caco2: keep within 0.3 of baseline (-5.8397) (decrease tolerance)

  - ames: keep within 0.1 of baseline (0.0886) (increase tolerance)

  The output molecule must satisfy ALL of the following hard constraints:

  - SMILES validity: must be parseable and sanitizable by RDKit (no radicals, no disconnected
  fragments, no unreasonable valences)

  - Molecular weight: < 600 Da

  - LogP: between -1 and 5

  - TPSA: < 140 A^2

  - H-bond donors: <= 5

  - H-bond acceptors: <= 10

  - Rotatable bonds: <= 10

  - Net formal charge: between -2 and +2

  - Synthetic accessibility: SA score < 4.5

  - PAINS filter: must pass (no pan-assay interference substructures)

  - Structural alerts: must pass Brenk/NIH reactive group filters

  - Tanimoto similarity to reference: >= 0.7 (Morgan fingerprint, radius=2, 2048 bits)

  - Boltz binding probability: affinity_probability_binary > 0.7

  The pocket is defined by residues (chain, 1-indexed SEQRES position): A:30, A:31,
  A:34, A:245, A:246, A:315, A:317, A:318, A:319, A:320, A:321, A:322, A:332, A:340,
  A:343, A:344, A:345, A:347, A:348, A:351, A:355, A:375, A:379, A:382, A:417, A:418,
  A:421, A:424, A:475, A:476, A:477, A:480, A:482, A:484, A:486, A:487, A:490, A:491,
  A:494

  Output a single SMILES string to solution.smi.'
target_ligand:
  resname: LIG
  chain: L
  residue_number: 1
  insertion_code: ' '
