id: smdd_004_Androgen_Receptor_8
name: Lead Optimization for Androgen_Receptor (8FH1)
description: 'You are given a co-folded protein-ligand complex (complex.pdb) and a
  reference ligand (reference.sdf). Modify the reference ligand to optimize the following
  properties:

  - binding_affinity: decrease by at least 0.3 from baseline -1.2847

  - herg: decrease by at least 0.1 from baseline 0.7900

  - cyp3a4: decrease by at least 0.1 from baseline 0.7552

  - ames: decrease by at least 0.1 from baseline 0.5914

  While holding these properties approximately constant:

  - bbb: keep within 0.1 of baseline (0.2989) (change tolerance)

  - caco2: keep within 0.3 of baseline (-5.2805) (decrease tolerance)

  - ppb: keep within 5.0 of baseline (91.1307) (increase tolerance)

  The output molecule must satisfy ALL of the following hard constraints:

  - SMILES validity: must be parseable and sanitizable by RDKit (no radicals, no disconnected
  fragments, no unreasonable valences)

  - Molecular weight: < 600 Da

  - LogP: between -1 and 5

  - TPSA: < 140 A^2

  - H-bond donors: <= 5

  - H-bond acceptors: <= 10

  - Rotatable bonds: <= 10

  - Net formal charge: between -2 and +2

  - Synthetic accessibility: SA score < 4.5

  - PAINS filter: must pass (no pan-assay interference substructures)

  - Structural alerts: must pass Brenk/NIH reactive group filters

  - Tanimoto similarity to reference: >= 0.7 (Morgan fingerprint, radius=2, 2048 bits)

  - Boltz binding probability: affinity_probability_binary > 0.7

  The pocket is defined by residues (chain, 1-indexed SEQRES position): A:40, A:42,
  A:43, A:44, A:45, A:46, A:47, A:48, A:50, A:80, A:81, A:84, A:85, A:88, A:91, A:102,
  A:103, A:104, A:119, A:126, A:212, A:213, A:215, A:216, A:217, A:219, A:228, A:230,
  A:234, A:238

  Output a single SMILES string to solution.smi.'
target_ligand:
  resname: LIG
  chain: L
  residue_number: 1
  insertion_code: ' '
pocket_residues: &id004
- - A
  - 40
- - A
  - 42
- - A
  - 43
- - A
  - 44
- - A
  - 45
- - A
  - 46
- - A
  - 47
- - A
  - 48
- - A
  - 50
- - A
  - 80
- - A
  - 81
- - A
  - 84
- - A
  - 85
- - A
  - 88
- - A
  - 91
- - A
  - 102
- - A
  - 103
- - A
  - 104
- - A
  - 119
- - A
  - 126
- - A
  - 212
- - A
  - 213
- - A
  - 215
- - A
  - 216
- - A
  - 217
- - A
  - 219
- - A
  - 228
- - A
  - 230
- - A
  - 234
- - A
  - 238
baseline_values:
  herg: 0.79
  bbb: 0.2989
  solubility: -4.4436
  cyp3a4: 0.7552
  clearance: 23.4014
  caco2: -5.2805
  ppb: 91.1307
  ames: 0.5914
  binding_affinity: -1.2847
optimization_objectives: &id003
- property: binding_affinity
  direction: minimize
  threshold: 0.3
- property: herg
  direction: minimize
  threshold: 0.1
- property: cyp3a4
  direction: minimize
  threshold: 0.1
- property: ames
  direction: minimize
  threshold: 0.1
hold_constant: &id001
- property: bbb
  tolerance: 0.1
  direction: change
- property: caco2
  tolerance: 0.3
  direction: decrease
- property: ppb
  tolerance: 5.0
  direction: increase
bbb_direction: maximize
hard_constraints:
- property: smiles_validity
  description: Parseable and sanitizable by RDKit (no radicals, no disconnected fragments,
    no unreasonable valences)
- property: molecular_weight
  threshold: <600 Da
  method: RDKit Descriptors.MolWt()
- property: logp
  threshold: -1 to 5
  method: RDKit Crippen.MolLogP()
- property: tpsa
  threshold: <140 A^2
  method: RDKit Descriptors.TPSA()
- property: hbd
  threshold: <=5
  method: RDKit Lipinski.NumHDonors()
- property: hba
  threshold: <=10
  method: RDKit Lipinski.NumHAcceptors()
- property: rotatable_bonds
  threshold: <=10
  method: RDKit Lipinski.NumRotatableBonds()
- property: formal_charge
  threshold: -2 to +2
  method: RDKit Chem.GetFormalCharge()
- property: synthetic_accessibility
  threshold: <4.5
  method: RDKit sascorer
- property: pains_filter
  description: Must pass (no pan-assay interference substructures)
  method: RDKit FilterCatalog with PAINS filters
- property: structural_alerts
  description: Must pass Brenk/NIH reactive group filters
  method: RDKit FilterCatalog with Brenk filters
- property: tanimoto_similarity
  threshold: '>=0.7'
  description: Morgan fingerprint, radius=2, 2048 bits
  method: RDKit AllChem.GetMorganFingerprintAsBitVect() + DataStructs.TanimotoSimilarity()
- property: boltz_binding_probability
  threshold: '>0.7'
  description: affinity_probability_binary from Boltz co-fold
input_files:
- complex.pdb
- reference.sdf
output_config:
  file_path: solution.smi
  format: smiles
evaluation:
- name: Validity
  module: metrics.chemistry
  function: assess_smiles_file_validity
  inputs:
  - source: output
    arg: file_path
  condition:
    eq: true
- name: Hard Constraints
  module: metrics.lead_optimization
  function: assess_hard_constraints
  result_key: all_passed
  inputs:
  - source: output
    arg: agent_file_path
  - source: file
    value: reference.sdf
    arg: reference_file_path
  condition:
    eq: true
- name: Hold-Constant Properties
  module: metrics.lead_optimization
  function: assess_hold_constant
  result_key: all_passed
  inputs:
  - source: output
    arg: agent_file_path
  - source: const
    value: &id002
      herg: 0.79
      bbb: 0.2989
      solubility: -4.4436
      cyp3a4: 0.7552
      clearance: 23.4014
      caco2: -5.2805
      ppb: 91.1307
      ames: 0.5914
      binding_affinity: -1.2847
    arg: baseline_values
  - source: const
    value: *id001
    arg: hold_constant
  condition:
    eq: true
- name: Optimization Objectives
  module: metrics.lead_optimization
  function: assess_optimization_objectives
  result_key: all_passed
  inputs:
  - source: output
    arg: agent_file_path
  - source: const
    value: *id002
    arg: baseline_values
  - source: const
    value: *id003
    arg: objectives
  condition:
    eq: true
- name: Boltz Binding & Affinity
  module: metrics.lead_optimization
  function: assess_boltz_task4
  result_key: all_passed
  inputs:
  - source: output
    arg: agent_file_path
  - source: file
    value: protein.fasta
    arg: protein_fasta_path
  - source: const
    value: *id004
    arg: pocket_contacts
  - source: const
    value: null
    arg: co_ligands
  - source: const
    value: -1.2847028076648712
    arg: baseline_affinity
  - source: const
    value:
      direction: minimize
      threshold: 0.3
    arg: affinity_objective
  - source: const
    value: null
    arg: affinity_hold_constant
  - source: const
    value: 10
    arg: diffusion_samples
  condition:
    eq: true
